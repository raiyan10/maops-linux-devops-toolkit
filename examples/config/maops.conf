# Example MAOps configuration file.
#
# This file is parsed as plain text only -- it is never sourced or
# evaluated as a shell script, so shell metacharacters in a value are never
# executed. Lines starting with # and blank lines are ignored.
#
# Resolution precedence, highest to lowest:
#   1. An explicit CLI argument (e.g. `maops report summary --format json`)
#   2. A MAOPS_* environment variable (e.g. MAOPS_OUTPUT_FORMAT=json)
#   3. This config file
#   4. The built-in default
#
# A value set here is overridden by the same setting supplied via
# environment variable or CLI flag at invocation time -- this file only
# changes what happens when nothing more specific is given.
#
# Only the four keys below are recognized. Copy this file to
# ${XDG_CONFIG_HOME:-$HOME/.config}/maops/config (or run `maops config
# init` to generate a fresh default there) and validate it with:
#
#   maops config validate /path/to/this/file

# Default output format for commands that support --format: text or json.
output_format=text

# Default number of processes shown by `maops process top` when no LIMIT
# argument is given. Must be a positive integer.
process_limit=10

# Default ping count for `maops network ping HOST` when no COUNT argument
# is given. Must be a positive integer.
ping_count=4

# Default timeout, in seconds, for network operations such as
# `maops network port`. Must be a positive integer.
network_timeout=5
