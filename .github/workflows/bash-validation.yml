name: Bash Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Syntax and ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck and Bats
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck bats

      - name: Run quality checks
        run: make quality

      - name: Validation completed
        run: echo "All Bash quality checks passed."