name: Bash Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Syntax and ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck bats python3

      - name: Run release check (quality, package, verify-package, smoke-install)
        env:
          HOME: ${{ runner.temp }}/maops-ci-home
        run: |
          mkdir -p "$HOME"
          make release-check

      - name: Validation completed
        run: echo "All Bash quality checks passed."