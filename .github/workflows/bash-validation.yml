name: Bash Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Syntax and ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck and Bats
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck bats python3

      - name: Run quality checks
        run: make quality

      - name: Build release package
        run: make package

      - name: Verify release package
        run: make verify-package

      - name: Smoke-test install / doctor / uninstall
        env:
          HOME: ${{ runner.temp }}/maops-ci-home
        run: |
          mkdir -p "$HOME"
          make smoke-install

      - name: Validation completed
        run: echo "All Bash quality checks passed."