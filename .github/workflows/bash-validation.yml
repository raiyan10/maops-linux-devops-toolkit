name: Bash CI

on:
  push:
  pull_request:

jobs:

  validate:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Bash Syntax

        run: |

          find scripts -name "*.sh" -exec bash -n {} \;

      - name: Install ShellCheck

        run: |

          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: ShellCheck

        run: |

          find scripts -name "*.sh" -exec shellcheck {} \;